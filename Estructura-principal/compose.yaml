services:
  db:
    image: postgres:17
    container_name: pg-practica4-5
    environment:
      POSTGRES_DB: ventas_industriales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:?Crea .env a partir de .env.example}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ventas_industriales"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
